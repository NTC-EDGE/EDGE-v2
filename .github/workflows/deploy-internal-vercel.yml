name: Deploy Internal - Vercel

on:
  push:
    branches:
      - develop
    tags:
      - 'internal-v*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/frontend/internal/**'
      - 'packages/api/**'
      - '.github/workflows/deploy-internal-vercel.yml'

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so merge-base can find ancestors

      - name: Verify Tag is on Main Branch
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ Error: Production deployments are only allowed from tags on the main branch!"
            exit 1
          fi
          echo "✅ Tag is verified to be on the main branch."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install

      - name: Resolve Vercel Environment
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "vercel_env=production" >> $GITHUB_OUTPUT
            echo "prod_flag=--prod" >> $GITHUB_OUTPUT
          else
            echo "vercel_env=preview" >> $GITHUB_OUTPUT
            echo "prod_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INTERNAL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=${{ steps.resolve.outputs.vercel_env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Validate Required Frontend Environment Variables
        run: |
          ENV_FILE=".vercel/.env.${{ steps.resolve.outputs.vercel_env }}.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ Error: Expected Vercel environment file $ENV_FILE was not generated!"
            exit 1
          fi

          CLERK_KEY=$(grep -E '^EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=' "$ENV_FILE" | tail -n 1 | cut -d '=' -f2- || true)
          CLERK_KEY="${CLERK_KEY%\"}"
          CLERK_KEY="${CLERK_KEY#\"}"
          CLERK_KEY="${CLERK_KEY%\'}"
          CLERK_KEY="${CLERK_KEY#\'}"
          CLERK_KEY="$(printf '%s' "$CLERK_KEY" | tr -d '[:space:]')"

          API_URL=$(grep -E '^EXPO_PUBLIC_API_URL=' "$ENV_FILE" | tail -n 1 | cut -d '=' -f2- || true)
          API_URL="${API_URL%\"}"
          API_URL="${API_URL#\"}"
          API_URL="${API_URL%\'}"
          API_URL="${API_URL#\'}"
          API_URL="$(printf '%s' "$API_URL" | tr -d '[:space:]')"

          if [ -z "$CLERK_KEY" ]; then
            echo "❌ Error: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is missing or empty in Vercel (${{ steps.resolve.outputs.vercel_env }}) environment!"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "❌ Error: EXPO_PUBLIC_API_URL is missing or empty in Vercel (${{ steps.resolve.outputs.vercel_env }}) environment!"
            exit 1
          fi

          if [ "${{ steps.resolve.outputs.vercel_env }}" = "production" ] && echo "$API_URL" | grep -qi "localhost"; then
            echo "❌ Error: EXPO_PUBLIC_API_URL points to localhost ($API_URL) in production!"
            exit 1
          fi

          cp "$ENV_FILE" "apps/frontend/internal/.env.${{ steps.resolve.outputs.vercel_env }}.local"
          echo "✅ Verified EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY and EXPO_PUBLIC_API_URL for ${{ steps.resolve.outputs.vercel_env }}."

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INTERNAL_PROJECT_ID }}
        run: npx vercel build ${{ steps.resolve.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INTERNAL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt ${{ steps.resolve.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = `🚀 **Vercel Preview Deployment Ready!**\n\n- **Preview URL:** [${previewUrl}](${previewUrl})\n- **Deployed commit:** ${context.sha}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Vercel Preview Deployment Ready!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
