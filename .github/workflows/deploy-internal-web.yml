name: Deploy Internal Web

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths:
      - 'apps/frontend/internal/**'
      - 'packages/api/**'
      - '.github/workflows/deploy-internal-web.yml'

jobs:
  deploy:
    name: Deploy Staff Portal Web App
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t edge-internal-web:${{ github.sha }} -f apps/frontend/internal/Dockerfile .

      - name: Save Docker Image to Tarball
        run: |
          docker save -o internal-web-image.tar edge-internal-web:${{ github.sha }}

      - name: Deploy to Server via SCP & SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          # Write SSH Private Key to file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Start SSH Agent
          eval $(ssh-agent -s)

          # Add Key to Agent depending on passphrase presence
          if [ -n "$SSH_PASSPHRASE" ]; then
            echo "SSH passphrase provided. Adding key via expect..."
            sudo apt-get update && sudo apt-get install -y expect
            expect -c "
              spawn ssh-add $HOME/.ssh/id_rsa
              expect \"Enter passphrase\"
              send \"$SSH_PASSPHRASE\r\"
              expect eof
            "
          else
            echo "No SSH passphrase provided. Adding key directly..."
            ssh-add ~/.ssh/id_rsa
          fi

          # Copy Tarball to Remote Host
          scp -o StrictHostKeyChecking=no internal-web-image.tar $SSH_USER@$SSH_HOST:/tmp/internal-web-image.tar

          # Execute Deployment Commands on Remote Host
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
            docker load -i /tmp/internal-web-image.tar
            docker stop edge-internal-web || true
            docker rm edge-internal-web || true
            docker run -d --name edge-internal-web -p 8081:80 edge-internal-web:${{ github.sha }}
            rm /tmp/internal-web-image.tar
          EOF
