name: Update Internal OTA

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'apps/frontend/internal/**'
      - 'packages/api/**'
      - '.github/workflows/update-internal-ota.yml'

jobs:
  update:
    name: EAS OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Resolve EAS Update Branch
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "branch=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "branch=preview" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "branch=development" >> $GITHUB_OUTPUT
          else
            echo "branch=preview" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/frontend/internal
          eas update --branch ${{ steps.resolve.outputs.branch }} --message "Auto OTA: ${{ github.event.head_commit.message }}" --non-interactive
