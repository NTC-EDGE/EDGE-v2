name: Build Client Android

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'apps/frontend/client/**'
      - 'packages/api/**'
      - '.github/workflows/build-client-android.yml'

jobs:
  build:
    name: EAS Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Resolve EAS Build Profile
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "profile=preview" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "profile=development" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS Cloud Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/frontend/client
          eas build --platform android --profile ${{ steps.resolve.outputs.profile }} --non-interactive
