name: Deploy Client - Vercel

on:
  push:
    branches:
      - develop
    tags:
      - 'client-v*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/frontend/client/**'
      - 'packages/api/**'
      - '.github/workflows/deploy-client-vercel.yml'

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so merge-base can find ancestors

      - name: Verify Tag is on Main Branch
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ Error: Production deployments are only allowed from tags on the main branch!"
            exit 1
          fi
          echo "✅ Tag is verified to be on the main branch."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install

      - name: Resolve Vercel Environment
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "vercel_env=production" >> $GITHUB_OUTPUT
            echo "prod_flag=--prod" >> $GITHUB_OUTPUT
          else
            echo "vercel_env=preview" >> $GITHUB_OUTPUT
            echo "prod_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Clean Stale Vercel Cache
        run: rm -rf .vercel

      - name: Validate Vercel Credentials & Test API
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing or empty. Please configure VERCEL_TOKEN in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID secret is missing or empty. Please configure VERCEL_ORG_ID in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::VERCEL_CLIENT_PROJECT_ID secret is missing or empty. Please configure VERCEL_CLIENT_PROJECT_ID in GitHub Repository Secrets."
            exit 1
          fi

          echo "🔍 Checking Vercel Secret format lengths:"
          echo "VERCEL_TOKEN length: ${#TOKEN}"
          echo "VERCEL_ORG_ID length: ${#ORG_ID} (prefix: ${ORG_ID:0:5}...)"
          echo "VERCEL_PROJECT_ID length: ${#PROJECT_ID} (prefix: ${PROJECT_ID:0:5}...)"

          check_http_status() {
            local step_name="$1"
            local status="$2"
            local body="$3"
            local remediation="$4"

            if [ "$status" = "200" ]; then
              echo "✅ $step_name verified (HTTP 200)."
              return 0
            fi

            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              echo "::error::❌ $step_name authentication/authorization failed (HTTP $status)! Response: $body"
              echo "Action required: $remediation"
              exit 1
            fi

            if [ "$status" = "404" ]; then
              echo "::error::❌ $step_name target not found (HTTP 404)! Response: $body"
              echo "Action required: $remediation"
              exit 1
            fi

            if [ "$status" = "429" ]; then
              echo "::warning::⚠️ $step_name hit Vercel API rate limit (HTTP 429). Response: $body. Skipping strict pre-flight gate to permit Vercel CLI native retries."
              return 0
            fi

            echo "::warning::⚠️ $step_name returned transient or server status (HTTP $status). Response: $body. Skipping strict pre-flight gate to permit Vercel CLI to proceed."
            return 0
          }

          echo "🔍 Step 1: Testing Vercel Token validity against /v2/user..."
          USER_RES=$(curl -s --connect-timeout 5 --max-time 15 -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.vercel.com/v2/user")
          USER_HTTP=$(echo "$USER_RES" | grep "HTTP_STATUS" | cut -d':' -f2 | tr -d ' \r\n')
          USER_BODY=$(echo "$USER_RES" | grep -v "HTTP_STATUS")
          echo "User Auth Status: $USER_HTTP"
          check_http_status "Vercel Token" "$USER_HTTP" "$USER_BODY" "Regenerate VERCEL_TOKEN in Vercel Account Settings -> Tokens and update GitHub Repository Secrets."

          echo "🔍 Step 2: Testing Vercel Project access against /v9/projects/$PROJECT_ID..."
          PROJ_RES=$(curl -s --connect-timeout 5 --max-time 15 -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$ORG_ID")
          PROJ_HTTP=$(echo "$PROJ_RES" | grep "HTTP_STATUS" | cut -d':' -f2 | tr -d ' \r\n')
          PROJ_BODY=$(echo "$PROJ_RES" | grep -v "HTTP_STATUS")
          echo "Project Query Status: $PROJ_HTTP"
          check_http_status "Project Access" "$PROJ_HTTP" "$PROJ_BODY" "Check that VERCEL_CLIENT_PROJECT_ID and VERCEL_ORG_ID match the project and team on Vercel, and that the token has team access."

          echo "✅ Authentication & Project Access Verified Successfully."

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
        run: npx --yes vercel pull --yes --environment=${{ steps.resolve.outputs.vercel_env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
        run: npx --yes vercel build ${{ steps.resolve.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(npx --yes vercel deploy --prebuilt ${{ steps.resolve.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = `🚀 **Vercel Preview Deployment Ready!**\n\n- **Preview URL:** [${previewUrl}](${previewUrl})\n- **Deployed commit:** ${context.sha}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Vercel Preview Deployment Ready!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
