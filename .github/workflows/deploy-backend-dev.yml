name: Deploy Backend - Development

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend/**'

jobs:
  build:
    name: Build & Compress Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t edge-backend-dev:${{ github.sha }} -f apps/backend/Dockerfile apps/backend

      - name: Save & Compress Image (Gzip)
        run: |
          docker save edge-backend-dev:${{ github.sha }} | gzip > backend-image-dev.tar.gz

      - name: Upload Compressed Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-dev
          path: backend-image-dev.tar.gz
          retention-days: 1

  deploy:
    name: Deploy Web API
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compressed Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-dev

      - name: Deploy to Server via SCP & SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          STORAGE_ENCRYPTION_MASTER_KEY: ${{ secrets.STORAGE_ENCRYPTION_MASTER_KEY }}
        run: |
          # Write SSH Private Key to file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
  
          # Start SSH Agent
          eval $(ssh-agent -s)
  
          # Add Key to Agent depending on passphrase presence
          if [ -n "$SSH_PASSPHRASE" ]; then
            echo "SSH passphrase provided. Adding key via expect..."
            sudo apt-get update && sudo apt-get install -y expect
            expect -c "
              spawn ssh-add $HOME/.ssh/id_rsa
              expect \"Enter passphrase\"
              send \"$SSH_PASSPHRASE\r\"
              expect eof
            "
          else
            echo "No SSH passphrase provided. Adding key directly..."
            ssh-add ~/.ssh/id_rsa
          fi
  
            # Secure Copy docker-compose.yml to Remote Host
            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p /opt/docker-stack/ntc-edge-api-dev"
            scp -o StrictHostKeyChecking=no apps/backend/docker-compose.yml $SSH_USER@$SSH_HOST:/opt/docker-stack/ntc-edge-api-dev/docker-compose.yml

            # Secure Copy Compressed Archive to Remote Host
            scp -o StrictHostKeyChecking=no backend-image-dev.tar.gz $SSH_USER@$SSH_HOST:/tmp/backend-image-dev.tar.gz
  
            # Execute Deployment Commands on Remote Host
            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
              # Export environment variables safely using bash @Q quoting
              export ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING@Q}
              export Clerk__SecretKey=${CLERK_SECRET_KEY@Q}
              export Clerk__WebhookSecret=${CLERK_WEBHOOK_SECRET@Q}
              export CloudflareR2__AccountId=${CLOUDFLARE_R2_ACCOUNT_ID@Q}
              export CloudflareR2__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID@Q}
              export CloudflareR2__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY@Q}
              export CloudflareR2__BucketName=${CLOUDFLARE_R2_BUCKET_NAME@Q}
              export StorageEncryption__MasterEncryptionKey=${STORAGE_ENCRYPTION_MASTER_KEY@Q}
              export GITHUB_SHA=${{ github.sha }}
              export IMAGE_NAME="edge-backend-dev"
              export CONTAINER_NAME="ntc-edge-api-dev"
              export ASPNETCORE_ENVIRONMENT="Development"

              # Unzip and load image in stream
              gunzip -c /tmp/backend-image-dev.tar.gz | docker load
              
              # Ensure the external network exists on the server first
              docker network create edge-network || true

              # Spin up using docker-compose
              cd /opt/docker-stack/ntc-edge-api-dev
              docker compose down || true
              docker compose up -d

              
              # Clean up temporary archive file
              rm /tmp/backend-image-dev.tar.gz
            EOF
