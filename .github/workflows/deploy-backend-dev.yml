name: Deploy Backend - Development

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:
    inputs:
      reset_database:
        description: '⚠️ Reset database? (drops public schema & re-seeds all data)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build & Compress Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t edge-backend-dev:${{ github.sha }} -f apps/backend/Dockerfile apps/backend

      - name: Save & Compress Image (Gzip)
        run: |
          docker save edge-backend-dev:${{ github.sha }} | gzip > backend-image-dev.tar.gz

      - name: Upload Compressed Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-dev
          path: backend-image-dev.tar.gz
          retention-days: 1

  deploy:
    name: Deploy Web API
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: development
    env:
      CONTAINER_NAME: "ntc-edge-api-dev"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compressed Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-dev

      - name: Copy docker-compose files to workspace root
        run: |
          cp apps/backend/docker-compose.yml ./docker-compose.yml
          cp apps/backend/docker-compose.dev.yml ./docker-compose.override.yml

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yml,docker-compose.override.yml,backend-image-dev.tar.gz"
          target: "/opt/docker-stack/${{ env.CONTAINER_NAME }}"

      - name: ⚠️ Database Reset Warning
        if: ${{ inputs.reset_database == true }}
        run: |
          echo "::warning::RESET_DATABASE is enabled. The public schema will be DROPPED and all data will be re-seeded on startup."

      - name: Deploy and Restart Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          STORAGE_ENCRYPTION_MASTER_KEY: ${{ secrets.STORAGE_ENCRYPTION_MASTER_KEY }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          RESET_DATABASE: "true" # TEMPORARY: revert this line after DB reset is confirmed
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DB_CONNECTION_STRING,CLERK_SECRET_KEY,CLERK_WEBHOOK_SECRET,CLOUDFLARE_R2_ACCOUNT_ID,CLOUDFLARE_R2_ACCESS_KEY_ID,CLOUDFLARE_R2_SECRET_ACCESS_KEY,CLOUDFLARE_R2_BUCKET_NAME,STORAGE_ENCRYPTION_MASTER_KEY,CONTAINER_NAME,RESET_DATABASE
          script: |
            # Export environment variables for Docker Compose
            export ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING"
            export Clerk__SecretKey="$CLERK_SECRET_KEY"
            export Clerk__WebhookSecret="$CLERK_WEBHOOK_SECRET"
            export CloudflareR2__AccountId="$CLOUDFLARE_R2_ACCOUNT_ID"
            export CloudflareR2__AccessKeyId="$CLOUDFLARE_R2_ACCESS_KEY_ID"
            export CloudflareR2__SecretAccessKey="$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
            export CloudflareR2__BucketName="$CLOUDFLARE_R2_BUCKET_NAME"
            export StorageEncryption__MasterEncryptionKey="$STORAGE_ENCRYPTION_MASTER_KEY"
            export IMAGE_TAG="${{ github.sha }}"
            export IMAGE_NAME="edge-backend-dev"
            export CONTAINER_NAME="$CONTAINER_NAME"
            export ASPNETCORE_ENVIRONMENT="Development"
            export RESET_DATABASE="$RESET_DATABASE"

            # Load the Docker image
            gunzip -c /opt/docker-stack/$CONTAINER_NAME/backend-image-dev.tar.gz | docker load
            
            # Restart the Compose stack (Docker Compose merges docker-compose.yml and docker-compose.override.yml automatically)
            cd /opt/docker-stack/$CONTAINER_NAME
            docker compose down || true
            docker compose up -d

            # Clean up upload archive
            rm -f backend-image-dev.tar.gz

            # Post-Deployment Health Check
            # On DB reset runs, seeding can take 60-120s before the API is ready.
            echo "Waiting for API to become ready (max 120s)..."
            MAX_WAIT=120
            INTERVAL=10
            ELAPSED=0

            CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' $CONTAINER_NAME | awk '{print $1}')

            until curl -s --max-time 5 http://$CONTAINER_IP:8080/ > /dev/null; do
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "❌ Error: API did not become ready within ${MAX_WAIT}s!"
                docker logs $CONTAINER_NAME
                exit 1
              fi

              if [ "$(docker inspect -f '{{.State.Running}}' $CONTAINER_NAME)" != "true" ]; then
                echo "❌ Error: Container $CONTAINER_NAME stopped unexpectedly!"
                docker logs $CONTAINER_NAME
                exit 1
              fi

              echo "  ⏳ Not ready yet (${ELAPSED}s elapsed)... retrying in ${INTERVAL}s"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            done

            echo "✅ Success: API is up and responding! (took ~${ELAPSED}s)"
