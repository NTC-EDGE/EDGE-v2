name: Update Client OTA
on:
  push:
    branches:
      - main
      - develop
jobs:
  update_production:
    if: ${{ github.ref_type == 'tag' }}
    type: update
    params:
      platform: all
      branch: production
      message: ${{ github.event.head_commit.message || 'Auto OTA Update' }}

  update_development:
    if: ${{ github.ref == 'refs/heads/develop' }}
    type: update
    params:
      platform: all
      branch: development
      message: ${{ github.event.head_commit.message || 'Auto OTA Update' }}

  update_preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    type: update
    params:
      platform: all
      branch: preview
      message: ${{ github.event.head_commit.message || 'Auto OTA Update' }}
